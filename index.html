<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitaCamping Banjarbaru - Admin Dashboard</title>
    <meta name="description" content="Aplikasi inventaris penyewaan alat camping KitaCamping Banjarbaru.">
    <link rel="stylesheet" href="styles.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div id="login-overlay" class="modal-overlay active">
        <div class="modal-content login-modal">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="assets/logo.png" alt="KitaCamping Logo" onerror="this.style.display='none'">
                <span>KitaCamping Admin</span>
            </div>
            <div class="form-group">
                <label>Password Rahasia</label>
                <input type="password" id="login-password" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="handleLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>
            <p id="login-error" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;">
                <i class="fa-solid fa-circle-exclamation"></i> Password salah!
            </p>
        </div>
    </div>

    <!-- ===== MODAL TAMBAH / EDIT BARANG ===== -->
    <div id="item-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Barang</h3>
                <button type="button" class="close-modal" onclick="closeItemModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="item-form" action="javascript:void(0)" onsubmit="submitItemForm(); return false;">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="item-name" required placeholder="Contoh: Tenda Dome 4 Orang">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="item-category" required>
                        <option value="tenda">Tenda</option>
                        <option value="carrier">Tas Carrier</option>
                        <option value="masak">Alat Masak</option>
                        <option value="tidur">Alat Tidur</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Harga Sewa (Per Hari / Rp)</label>
                    <input type="number" id="item-price" required min="0" placeholder="Contoh: 50000">
                </div>
                <div class="form-group">
                    <label>URL Gambar</label>
                    <input type="url" id="item-image" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Stok Total</label>
                    <input type="number" id="item-stock-total" required value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Stok Keluar (Sedang Disewa)</label>
                    <input type="number" id="item-stock-out" required value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="item-desc" rows="3" required placeholder="Deskripsi singkat barang..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn filter-btn" onclick="closeItemModal()">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="submitItemForm()">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <img src="assets/logo.png" alt="KitaCamping Logo" id="navbar-logo" onerror="this.style.display='none'">
                <span>KitaCamping</span>
            </div>
            <div class="nav-links">
                <a href="#" onclick="handleLogout()" style="color: #ef4444;">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </a>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="katalog" class="catalog-section" style="padding-top: 8rem;">

        <!-- Analytics Cards -->
        <div class="analytics-grid">
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--primary); background: rgba(245, 158, 11, 0.1);">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <div class="stat-info">
                    <h4 id="stat-total">0</h4>
                    <p>Total Barang</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <div class="stat-info">
                    <h4 id="stat-out">0</h4>
                    <p>Barang Keluar</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #10b981; background: rgba(16, 185, 129, 0.1);">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <h4 id="stat-ready">0</h4>
                    <p>Sisa Barang (Ready)</p>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2>Manajemen <span class="highlight">Inventaris</span></h2>
        </div>

        <div class="filters-container">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="tenda">Tenda</button>
                <button class="filter-btn" data-filter="carrier">Tas Carrier</button>
                <button class="filter-btn" data-filter="masak">Alat Masak</button>
                <button class="filter-btn" data-filter="tidur">Alat Tidur</button>
                <button class="filter-btn" data-filter="lainnya">Lainnya</button>
            </div>
            <button class="btn btn-primary" onclick="openItemModal()">
                <i class="fa-solid fa-plus"></i> Tambah Barang
            </button>
        </div>

        <div id="loading-indicator" style="text-align: center; padding: 2rem; color: var(--primary); display: none;">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top: 1rem;">Memuat Data...</p>
        </div>

        <div class="catalog-grid" id="catalog-grid">
            <!-- Items injected by app.js -->
        </div>
    </main>

    <footer id="kontak">
        <div class="footer-bottom" style="padding: 2rem;">
            <p>&copy; 2026 KitaCamping Banjarbaru. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js?v=4"></script>
</body>
</html>
